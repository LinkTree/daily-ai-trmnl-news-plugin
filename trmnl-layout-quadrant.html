<!-- Quadrant Layout - Image + Title -->
<div class="layout layout--col layout--center gap--small">
  <img src="{{ image_url }}" alt="Daily AI" class="image-dither" style="width: 100%; max-height: 80px; object-fit: cover; border-radius: 6px;" />
  <span class="title title--small" style="text-align: center;">{{ title }}</span>
  <span class="label label--small">dailyaibyai.news</span>
</div>
