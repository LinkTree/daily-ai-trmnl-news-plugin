<!-- Half Vertical Layout - Image + Top Stories -->
<div class="layout layout--col gap--space-between">

  <!-- Image Section -->
  <div class="item">
    <img src="{{ image_url }}" alt="Daily AI" class="image-dither w--full" style="height: 120px; object-fit: cover; border-radius: 6px;" />
  </div>

  <!-- Stories Section -->
  <div class="layout layout--col gap--small">
    {% for story in stories limit:2 %}
    <div class="item pb--small" style="border-bottom: 1px solid rgba(0,0,0,0.15);">
      <div class="content">
        <span class="title title--small">{{ story.headline }}</span>
        <span class="description">{{ story.summary }}</span>
      </div>
    </div>
    {% endfor %}
  </div>

</div>

<!-- Footer -->
<div class="title_bar">
  <img class="image" src="https://usetrmnl.com/images/plugins/trmnl--render.svg" />
  <span class="title">Daily AI by AI</span>
  <span class="instance">{{ date | date: "%b %e, %Y" }}</span>
</div>
